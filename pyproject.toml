[project]
name = "atomic-swap-cli"
version = "0.1.0"
description = "Cross-chain atomic swaps over Lightning (CLN hold invoices) between two simulated Bitcoin regtest networks"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "grpcio-tools>=1.60"]

[project.scripts]
atomic-swap-cli = "atomic_swap_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atomic_swap_cli*"]
